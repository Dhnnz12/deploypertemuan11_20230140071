<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mahasiswa Portal</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="floating-shape shape-1" style="background: var(--accent-light-blue);"></div>
<div class="floating-shape shape-2" style="background: var(--primary-blue);"></div>
<div class="floating-shape shape-3" style="background: var(--accent-green);"></div>

<div class="auth-page">
    <div class="container" style="max-width: 500px; width: 100%;">
        <div class="text-center">
            <h2 style="font-size: 2rem; margin-top: 1rem;">Registrasi</h2>
            <div class="section-title">Buat Akun Baru</div>
        </div>
        
        <form th:action="@{/register}" method="post" th:object="${request}" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" th:field="*{nama}" placeholder="Contoh: Budi Santoso" required>
            </div>
            
            <div class="form-group">
                <label>Alamat</label>
                <input type="text" th:field="*{alamat}" placeholder="Contoh: Jl. Merdeka No. 10" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}" placeholder="Buat username unik" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Buat password" required>
            </div>

            <button type="submit" class="btn btn-green" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">
                Daftar Sekarang
            </button>
        </form>

        <div class="text-center mt-4" style="border-top: 2px solid var(--black); padding-top: 1.5rem;">
            <p style="font-weight: 700; margin-bottom: 0.5rem;">Sudah punya akun?</p>
            <a th:href="@{/login}" class="btn btn-light-blue" style="width: 100%; font-size: 1rem;">
                Login di sini
            </a>
        </div>
    </div>
</div>

</body>
</html>
